<!DOCTYPE html>
<html>
<head> 
<title> My Superhero Card</title>
<style>
/* Typograhy - font, size, weight colour for the whole page*/
body {
    background-color: darkblue;
    color: white;
    font-family: arial, sans-serif;
}

/* Typography + Text Shadow - Big Bold title with and orange shadow */
.hero-name{ 
font-size: 60px;
font-weight: bold;
color:yellow;
text-shadow: 3px 3px orange;
}







/* Typography + Text transform - tagline becomes Title case */
.tagline {font-style: italic
    ;
color: lightblue;
text-transform: capitalize;}

/* Text Transform + TExt decoration - section headings in CAPS with underline */
.label {
text-transform: uppercase;
text-decoration: underline;
color: coral;
}
/* Typography powers stand out in bold green*/
.power {font-weight: bold;
color: lightgreen;}



/* Typography Weakness are crossed out*/
.weakness {
    text-decoration: line-through;
    color:gray;
}

/* Transform - the badge is tilted to the side */
.badge {
font-size: 28px;
font-weight: bold;
color: gold;
transform: rotate(15deg);
}
/* Typography - footer text */
.made-by{
color: coral;
font-style: italic;
}
</style>
</head>
<body>

    <h1 class="hero-name"> Thunder Kid</h1>
    <p class="tagline"> the most powerful hero in the school</p>

<h2 class="label"> super powers</h2>
<p class="power"> can run faster than a cheetah</p>
<p class="power"> can lift a school bus</p>

<h2 class="label"> weaknesses</h2>
<p class="weakness"> Maths Homework</p>
<p class="weakness"> Broccoli</p>

<p class="badge"> Top Hero </p>

<p class="made-by"> Created By Dhruv</p>

</body>
</html>

















































</body>



















</style>

</head>










































</html>
